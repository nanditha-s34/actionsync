<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionSync | Voice-to-Task</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4">
  <div class="max-w-2xl mx-auto space-y-6">
    
    <header class="text-center space-y-1">
      <h1 class="text-3xl font-extrabold text-white">Action<span class="text-indigo-400">Sync</span></h1>
      <p class="text-slate-400 text-sm">Transform live voice recordings or audio files into structured action items.</p>
    </header>

    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-4">
      <div class="flex items-center justify-center gap-3">
        <button 
          id="recordBtn" 
          onclick="toggleRecording()" 
          class="flex items-center gap-2 px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-lg font-medium transition cursor-pointer"
        >
          <span id="recordDot" class="w-3 h-3 rounded-full bg-white"></span>
          <span id="recordText">Start Recording</span>
        </button>
      </div>

      <div class="flex items-center my-2">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="px-3 text-xs text-slate-500 uppercase tracking-wider">or upload file</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>

      <input 
        type="file" 
        id="audioFile" 
        accept="audio/*" 
        class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer" 
      />
      <button 
        id="submitBtn" 
        onclick="processAudioFile()" 
        class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-medium transition"
      >
        Process Audio File
      </button>

      <p id="status" class="text-xs text-slate-400 text-center hidden"></p>
    </div>

    <div id="results" class="hidden space-y-4">
      <div class="bg-slate-800/60 border border-slate-700 p-4 rounded-xl">
        <h2 class="text-xs uppercase text-slate-400 font-semibold mb-1">Transcript</h2>
        <p id="transcript" class="text-sm italic text-slate-200"></p>
      </div>
      <div id="taskList" class="space-y-3"></div>
    </div>

  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    const recordBtn = document.getElementById('recordBtn');
    const recordText = document.getElementById('recordText');
    const recordDot = document.getElementById('recordDot');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    const transcriptEl = document.getElementById('transcript');
    const taskList = document.getElementById('taskList');

    async function toggleRecording() {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            sendAudioToBackend(audioBlob, 'recording.webm');
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          isRecording = true;
          recordText.textContent = 'Stop Recording';
          recordDot.classList.add('animate-ping');
          status.classList.remove('hidden');
          status.textContent = 'Listening... Speak your tasks.';
        } catch (err) {
          alert('Microphone access denied or not available: ' + err.message);
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordText.textContent = 'Start Recording';
        recordDot.classList.remove('animate-ping');
        status.textContent = 'Transcribing and extracting tasks...';
      }
    }

    async function processAudioFile() {
      const fileInput = document.getElementById('audioFile');
      if (!fileInput.files.length) {
        alert('Please select an audio file first.');
        return;
      }
      sendAudioToBackend(fileInput.files[0], fileInput.files[0].name);
    }

    async function sendAudioToBackend(audioBlobOrFile, filename) {
      const formData = new FormData();
      formData.append('file', audioBlobOrFile, filename);

      status.classList.remove('hidden');
      status.textContent = 'Processing audio with Groq AI...';

      try {
        const res = await fetch('https://actionsync.onrender.com', {
          method: 'POST',
          body: formData
        });

        if (!res.ok) throw new Error('Failed to process audio');
        const data = await res.json();

        transcriptEl.textContent = `"${data.transcript}"`;
        taskList.innerHTML = '';

        data.tasks.forEach(task => {
          const card = document.createElement('div');
          card.className = 'bg-slate-800 border border-slate-700 p-4 rounded-xl flex justify-between items-start';
          card.innerHTML = `
            <div>
              <p class="font-medium text-white">${task.title}</p>
              <p class="text-xs text-slate-400">Assignee: ${task.assignee || 'Self'} ${task.due_hint ? ' | Due: ' + task.due_hint : ''}</p>
            </div>
            <span class="text-xs px-2 py-1 rounded bg-indigo-500/20 text-indigo-300 font-medium">${task.priority}</span>
          `;
          taskList.appendChild(card);
        });

        results.classList.remove('hidden');
        status.classList.add('hidden');
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
